<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>USDT Live Dashboard</title>

<style>
  body {
    margin: 0;
    font-family: -apple-system;
    background: #0b1220;
    color: white;
    display: flex;
    justify-content: center;
    padding: 30px;
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: #111a2e;
    padding: 20px;
    border-radius: 16px;
  }

  h1 { font-size: 20px; }

  .box {
    background: #0f172a;
    padding: 12px;
    border-radius: 10px;
    margin: 10px 0;
  }

  .price {
    font-size: 22px;
    color: #38bdf8;
    font-weight: bold;
  }

  input {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    border-radius: 8px;
    border: none;
  }

  button {
    width: 100%;
    margin-top: 10px;
    padding: 10px;
    border-radius: 10px;
    border: none;
    background: #38bdf8;
    font-weight: bold;
  }
</style>
</head>

<body>

<div class="card">
  <h1>💱 USDT Live Dashboard</h1>

  <div class="box">
    USDT Price
    <div class="price" id="usdt">Loading...</div>
  </div>

  <div class="box">
    USD → TWD
    <div class="price" id="twd">Loading...</div>
  </div>

  <div class="box">
    USD → PHP
    <div class="price" id="php">Loading...</div>
  </div>

  <div class="box">
    <input id="amt" placeholder="輸入 USDT" />
    <div id="calc"></div>
  </div>

  <button onclick="load()">Refresh</button>
</div>

<script>
let usdTwd = 0;
let usdPhp = 0;
let usdtUsd = 1;

async function load() {
  const usdtRes = await fetch("https://api.coingecko.com/api/v3/simple/price?ids=tether&vs_currencies=usd");
  const usdtData = await usdtRes.json();
  usdtUsd = usdtData.tether.usd;

  const fxRes = await fetch("https://api.exchangerate-api.com/v4/latest/USD");
  const fx = await fxRes.json();

  usdTwd = fx.rates.TWD;
  usdPhp = fx.rates.PHP;

  document.getElementById("usdt").innerText = usdtUsd.toFixed(4);
  document.getElementById("twd").innerText = (usdtUsd * usdTwd).toFixed(2);
  document.getElementById("php").innerText = (usdtUsd * usdPhp).toFixed(2);
}

document.getElementById("amt").addEventListener("input", e => {
  const v = parseFloat(e.target.value || 0);
  document.getElementById("calc").innerText =
    `≈ ${(v * usdtUsd * usdTwd).toFixed(2)} TWD / ${(v * usdtUsd * usdPhp).toFixed(2)} PHP`;
});

setInterval(load, 5000);
load();
</script>

</body>
</html>
