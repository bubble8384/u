<script>

let usdt = 1;
let twd = 0;
let php = 0;

async function safeFetch(url) {
  try {
    const res = await fetch(url);
    return await res.json();
  } catch (e) {
    return null;
  }
}

async function load() {

  // ===== Binance =====
  const b = await safeFetch("https://api.binance.com/api/v3/ticker/price?symbol=USDTUSDT");

  if (b && b.price) {
    usdt = parseFloat(b.price);
    document.getElementById("binance").innerText = usdt.toFixed(4);
  } else {
    document.getElementById("binance").innerText = "API error";
  }

  // ===== FX =====
  const fx = await safeFetch("https://api.exchangerate-api.com/v4/latest/USD");

  if (fx && fx.rates) {
    twd = fx.rates.TWD;
    php = fx.rates.PHP;

    document.getElementById("twd").innerText = (usdt * twd).toFixed(2);
    document.getElementById("php").innerText = (usdt * php).toFixed(2);
  } else {
    document.getElementById("twd").innerText = "FX error";
    document.getElementById("php").innerText = "FX error";
  }

  // ===== Arbitrage =====
  let market = usdt * twd;
  let alt = market * 1.01;

  let spread = alt - market;

  const signal = document.getElementById("signal");
  const detail = document.getElementById("detail");

  detail.innerText = `Market: ${market.toFixed(2)} | Alt: ${alt.toFixed(2)}`;

  if (spread > 0.5) {
    signal.innerText = "🟢 OPPORTUNITY";
    signal.className = "price good";
  } else {
    signal.innerText = "🔴 NO OPPORTUNITY";
    signal.className = "price bad";
  }
}

setInterval(load, 5000);
load();

</script>
