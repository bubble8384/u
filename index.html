<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Arbitrage Dashboard</title>

<style>
body {
  margin:0;
  font-family:-apple-system;
  background:#0b1220;
  color:white;
  display:flex;
  justify-content:center;
  padding:20px;
}

.card {
  width:100%;
  max-width:420px;
  background:#111a2e;
  padding:20px;
  border-radius:16px;
}

.box {
  background:#0f172a;
  padding:12px;
  border-radius:10px;
  margin:10px 0;
}

.price {
  font-size:20px;
  color:#38bdf8;
  font-weight:bold;
}

.good { color:#34d399; }
.bad { color:#fb7185; }

input {
  width:100%;
  padding:10px;
  border-radius:8px;
  border:none;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="card">
  <h2>📊 Arbitrage Dashboard</h2>

  <div class="box">
    Binance USDT
    <div class="price" id="binance">Loading...</div>
  </div>

  <div class="box">
    USD → TWD
    <div class="price" id="twd">Loading...</div>
  </div>

  <div class="box">
    USD → PHP
    <div class="price" id="php">Loading...</div>
  </div>

  <div class="box">
    💳 KAST (estimated)
    <div class="price" id="kast">Loading...</div>
  </div>

  <div class="box">
    📈 Arbitrage Spread (TWD)
    <div class="price" id="spread">Loading...</div>
  </div>

  <button onclick="load()">Refresh</button>
</div>

<script>

let usdt = 1;
let twd = 0;
let php = 0;
let kastRate = 1;

async function load() {

  // 1. Binance USDT price
  const b = await fetch("https://api.binance.com/api/v3/ticker/price?symbol=USDTUSDT");
  const bd = await b.json();
  usdt = parseFloat(bd.price || 1);

  // 2. FX rates
  const fx = await fetch("https://api.exchangerate-api.com/v4/latest/USD");
  const fxd = await fx.json();
  twd = fxd.rates.TWD;
  php = fxd.rates.PHP;

  // 3. KAST model (placeholder)
  kastRate = 1.01; // 假設 1% spread

  // UI
  document.getElementById("binance").innerText = usdt.toFixed(4);
  document.getElementById("twd").innerText = (usdt * twd).toFixed(2);
  document.getElementById("php").innerText = (usdt * php).toFixed(2);
  document.getElementById("kast").innerText = (usdt * kastRate).toFixed(4);

  // Arbitrage logic (TWD vs KAST proxy)
  let marketTwd = usdt * twd;
  let kastTwd = usdt * kastRate * twd;

  let spread = kastTwd - marketTwd;

  let el = document.getElementById("spread");

  el.innerText = spread.toFixed(2);

  if (spread > 0) {
    el.className = "price good";
  } else {
    el.className = "price bad";
  }
}

setInterval(load, 5000);
load();

</script>

</body>
</html>
